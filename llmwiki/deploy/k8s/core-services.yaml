# 核心服务部署(编译 worker 的隔离见 compile-worker.yaml)。
# 生产建议 Postgres/Redis 用托管服务;此处给自托管 StatefulSet 示意。
---
apiVersion: v1
kind: Secret
metadata: { name: llmwiki }
type: Opaque
stringData:
  pg_dsn: "postgresql://llmwiki:llmwiki@postgres:5432/llmwiki"
  anthropic_api_key: "REPLACE_ME"
  internal_hmac_secret: "REPLACE_ME"
  jwt_secret: "REPLACE_ME"
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_USER, value: llmwiki }
            - { name: POSTGRES_PASSWORD, value: llmwiki }
            - { name: POSTGRES_DB, value: llmwiki }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 50Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - { name: redis, image: "redis:7-alpine", ports: [{ containerPort: 6379 }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: evidence }
spec:
  replicas: 3
  selector: { matchLabels: { app: evidence } }
  template:
    metadata: { labels: { app: evidence } }
    spec:
      containers:
        - name: evidence
          image: llmwiki:latest
          command: ["uvicorn", "app.evidence.service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{ containerPort: 8001 }]
          env:
            - { name: PG_DSN, valueFrom: { secretKeyRef: { name: llmwiki, key: pg_dsn } } }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: INTERNAL_HMAC_SECRET, valueFrom: { secretKeyRef: { name: llmwiki, key: internal_hmac_secret } } }
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: llmwiki, key: anthropic_api_key } } }
---
apiVersion: v1
kind: Service
metadata: { name: evidence }
spec: { selector: { app: evidence }, ports: [{ port: 8001 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: query }
spec:
  replicas: 3
  selector: { matchLabels: { app: query } }
  template:
    metadata: { labels: { app: query } }
    spec:
      containers:
        - name: query
          image: llmwiki:latest
          command: ["uvicorn", "app.query.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ containerPort: 8000 }]
          env:
            - { name: EVIDENCE_URL, value: "http://evidence:8001" }
            - { name: INTERNAL_HMAC_SECRET, valueFrom: { secretKeyRef: { name: llmwiki, key: internal_hmac_secret } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: llmwiki, key: jwt_secret } } }
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: llmwiki, key: anthropic_api_key } } }
---
apiVersion: v1
kind: Service
metadata: { name: query }
spec:
  type: LoadBalancer
  selector: { app: query }
  ports: [{ port: 80, targetPort: 8000 }]
---
# 交互式问答按 HTTP QPS 扩缩(需 prometheus-adapter / KEDA prometheus trigger)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: query-hpa }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: query }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
