version: "3.9"

services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: llmwiki
      POSTGRES_PASSWORD: llmwiki
      POSTGRES_DB: llmwiki
    ports: ["5432:5432"]
    volumes:
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../app/db/auth_schema.sql:/docker-entrypoint-initdb.d/02_auth.sql:ro
      - pgdata:/var/lib/postgresql/data

  redis:
    image: docker.m.daocloud.io/redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  evidence:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.evidence.service:app --host 0.0.0.0 --port 8001
    environment:
      PG_DSN: postgresql://llmwiki:llmwiki@postgres:5432/llmwiki
      REDIS_URL: redis://redis:6379/0
      INTERNAL_HMAC_SECRET: dev-internal-secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    ports: ["8001:8001"]
    depends_on: [postgres, redis]

  query:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.query.gateway:app --host 0.0.0.0 --port 8000
    environment:
      EVIDENCE_URL: http://evidence:8001
      PG_DSN: postgresql://llmwiki:llmwiki@postgres:5432/llmwiki
      REDIS_URL: redis://redis:6379/0
      INTERNAL_HMAC_SECRET: dev-internal-secret
      JWT_SECRET: dev-jwt-secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    ports: ["8000:8000"]
    depends_on: [evidence]

  admin:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.admin.service:app --host 0.0.0.0 --port 8002
    environment:
      PG_DSN: postgresql://llmwiki:llmwiki@postgres:5432/llmwiki
      JWT_SECRET: dev-jwt-secret
      PLATFORM_ADMIN_KEY: dev-admin-key
    ports: ["8002:8002"]
    depends_on: [postgres]

  ingest:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.ingest.service:app --host 0.0.0.0 --port 8003
    environment:
      PG_DSN: postgresql://llmwiki:llmwiki@postgres:5432/llmwiki
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-jwt-secret
    ports: ["8003:8003"]
    depends_on: [postgres, redis]

  compile-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python -m app.compile.run_worker
    environment:
      PG_DSN: postgresql://llmwiki:llmwiki@postgres:5432/llmwiki
      REDIS_URL: redis://redis:6379/0
      INTERNAL_HMAC_SECRET: dev-internal-secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      MINERU_URL: ${MINERU_URL:-}
    depends_on: [postgres, redis]

  scheduler:
    # on_schedule 调度器:周期触发 daily_maintenance(decay / lint / crosslink / 巩固)
    build:
      context: ..
      dockerfile: Dockerfile
    command: python -m app.maintain.scheduler
    environment:
      PG_DSN: postgresql://llmwiki:llmwiki@postgres:5432/llmwiki
      REDIS_URL: redis://redis:6379/0
      INTERNAL_HMAC_SECRET: dev-internal-secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      SCHEDULE_INTERVAL_SEC: ${SCHEDULE_INTERVAL_SEC:-86400}
    depends_on: [postgres, redis]

  generation:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.generation.service:app --host 0.0.0.0 --port 8004
    environment:
      EVIDENCE_URL: http://evidence:8001
      PG_DSN: postgresql://llmwiki:llmwiki@postgres:5432/llmwiki
      INTERNAL_HMAC_SECRET: dev-internal-secret
      JWT_SECRET: dev-jwt-secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GENERATION_OUTPUT_DIR: /data/generated
    volumes: [gendata:/data/generated]
    ports: ["8004:8004"]
    depends_on: [evidence]

volumes:
  pgdata:
  miniodata:
  gendata:
