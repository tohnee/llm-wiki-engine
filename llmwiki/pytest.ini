[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py smoke.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
asyncio_mode = auto
markers =
    smoke: 离线纯逻辑冒烟(零外部依赖)
    integration: 需 Postgres/Redis/LLM API
    slow: 编译/检索长链路
filterwarnings =
    ignore::DeprecationWarning
