name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "llmwiki/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llmwiki/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: llmwiki/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (Demo mode for GitHub Pages)
        env:
          # 子路径部署:仓库名 llm-wiki-engine
          VITE_BASE: /llm-wiki-engine/
          # 纯前端预览,后端不可达,UI 展示 Demo 横幅
          VITE_DEMO_MODE: "1"
          # 留空 → fetch 走相对路径(同源),Demo 模式下大部分调用被横幅说明覆盖
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Create SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll (避免 Jekyll 处理 _ 开头资源)
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: llmwiki/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
